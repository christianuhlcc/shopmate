# Production override for the EC2 host — images come from ECR instead of
# local builds, nginx terminates TLS, certbot renews the Let's Encrypt cert.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# .env (rendered by deploy/aws/deploy-on-instance.sh from SSM Parameter Store)
# provides: DOMAIN, ECR_REGISTRY, IMAGE_TAG, DB_PASSWORD, GOOGLE_*, JWT_SECRET,
# PICNIC_CREDENTIAL_ENC_KEY.
#
# BOOTSTRAP_INVITE_CODE is inherited from the base compose file and defaults to
# empty (disabled). Prod already has a group via the V4 backfill, so it should
# stay unset here — while set, any signed-in user can create a group.
#
# PICNIC_CREDENTIAL_ENC_KEY is also inherited from the base compose file. It
# must be set to a real secret in prod (ADR-0014) — the base file's default is
# dev-only and encrypts every user's Picnic credential digest under a
# published, non-secret key if left unset.

# Container logs stay on the host (`docker compose logs`). The `local` driver
# rotates by itself (5 x 20 MB per container); the default json-file never does.
# (Until 2026-11 logs/traces/metrics went to Dash0 via an OTel collector sidecar,
# see ADR-0011; removed with the Dash0 subscription.)
x-logging: &logging
  driver: local

services:
  postgres:
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${ECR_REGISTRY}/shopmate/backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      FRONTEND_BASE_URL: https://${DOMAIN}
      # 2 GiB host shared with postgres + nginx: cap the JVM at half the
      # container-visible RAM instead of the default quarter. (The OTel Java
      # agent is still in the image but inert without -javaagent.)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    logging: *logging

  frontend:
    image: ${ECR_REGISTRY}/shopmate/frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging

  nginx:
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    logging: *logging
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      # Logbook (garmin repo): server block + htpasswd, built static site, and
      # the PUT-only upload inbox (nginx uid 101 writes, the host sync job reads).
      # Docker creates missing host dirs empty; then the include matches nothing.
      - /srv/garmin/nginx:/etc/nginx/logbook:ro
      - /srv/garmin/site:/srv/logbook/site:ro
      - /srv/garmin/upload:/srv/logbook/upload
    # The image's entrypoint only runs its envsubst template step when the
    # command starts with "nginx" — with a custom command we must render the
    # template ourselves. The reload loop picks up certs renewed by certbot.
    command: >-
      /bin/sh -c "envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && (while :; do sleep 6h; nginx -s reload; done &)
      && exec nginx -g 'daemon off;'"

  # Renews via webroot through nginx's :80 ACME location. The first issuance
  # is done standalone by deploy-on-instance.sh before nginx can start.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    logging: *logging

volumes:
  letsencrypt:
  certbot-webroot:
