openapi: "3.1.0"
info:
  title: ShopMate API
  version: "1.0.0"
  description: |
    Collaborative shopping list API with CRDT-based concurrent editing.
    All timestamps are server-assigned (epoch milliseconds). Clients never supply timestamps.
  contact:
    name: ShopMate
    email: uhl.christian@googlemail.com

tags:
  - name: Auth
    description: Authentication and token exchange
  - name: Users
    description: User profile operations
  - name: Lists
    description: Shopping list management
  - name: Items
    description: Shopping item CRDT mutations
  - name: Groups
    description: Group (tenant) operations
  - name: Invites
    description: Invite code issuance and redemption
  - name: Events
    description: Real-time SSE event streaming
  - name: PicnicExport
    description: Picnic grocery-export credential linking and per-list export

servers:
  - url: /api

security:
  - bearerAuth: []

paths:
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/exchange:
    post:
      tags: [Auth]
      operationId: exchangeAuthCode
      summary: Exchange a short-lived auth code for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /lists:
    get:
      tags: [Lists]
      operationId: getLists
      summary: Get all shopping lists for the current user
      responses:
        "200":
          description: List of shopping lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingList'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Lists]
      operationId: createList
      summary: Create a new shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        "201":
          description: Created list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /lists/{listId}:
    get:
      tags: [Lists]
      operationId: getList
      summary: Get a shopping list with all its items
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        "200":
          description: Shopping list with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListWithItems'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /lists/{listId}/items:
    post:
      tags: [Items]
      operationId: addItem
      summary: Add a new item to a shopping list
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /lists/{listId}/items/{itemId}:
    patch:
      tags: [Items]
      operationId: updateItem
      summary: Apply a single-field CRDT change to an item
      description: |
        Applies one LWW field mutation. The server assigns the timestamp.
        Clients must NOT supply timestamps — they are ignored if present.
        Move operations (SORT_KEY field) must use this endpoint, never delete+reinsert.
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemChangeRequest'
      responses:
        "200":
          description: Updated item after merge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Items]
      operationId: deleteItem
      summary: Soft-delete an item (sets deleted tombstone)
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        "204":
          description: Item deleted (tombstoned)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /groups/me:
    get:
      tags: [Groups]
      operationId: getMyGroup
      summary: Get the current user's group, including its members
      responses:
        "200":
          description: The caller's group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/NoGroup'

  /invites:
    post:
      tags: [Invites]
      operationId: createInvite
      summary: Create a single-use invite code (JOIN_GROUP or NEW_GROUP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        "201":
          description: Created invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCodeResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/NoGroup'

  /invites/redeem:
    post:
      tags: [Invites]
      operationId: redeemInvite
      summary: Redeem an invite code, joining or creating a group
      description: |
        JOIN_GROUP codes add the caller to the issuer's group. NEW_GROUP codes
        create a brand-new group named by the redeemer; if groupName is omitted
        on a NEW_GROUP code, the request fails with 400 GROUP_NAME_REQUIRED so
        the client can prompt for a name and resubmit — the response never
        reveals the invite's type up front.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInviteRequest'
      responses:
        "200":
          description: Updated user profile with group set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /lists/{listId}/sse-token:
    post:
      tags: [Events]
      operationId: getSseToken
      summary: Get a short-lived token for SSE subscription
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        "200":
          description: Short-lived SSE token (15-min TTL, scoped to listId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseTokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /lists/{listId}/events:
    get:
      tags: [Events]
      operationId: subscribeToListEvents
      summary: Subscribe to real-time item change events (SSE)
      description: |
        Server-Sent Events stream. Auth via ?token= query parameter because
        the browser EventSource API cannot set custom headers.
        Token must be obtained from POST /lists/{listId}/sse-token first.
      security: []
      parameters:
        - $ref: '#/components/parameters/ListId'
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Short-lived SSE token from /sse-token endpoint
      responses:
        "200":
          description: SSE stream of ItemChangeEvent objects
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ItemChangeEvent'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /users/me/picnic-credentials:
    put:
      tags: [PicnicExport]
      operationId: linkPicnicCredentials
      summary: Link a Picnic account for grocery export
      description: |
        Exchanges the password for a Picnic session and stores that session; the
        password itself is never persisted. If Picnic rejects the login, responds
        422 with code PICNIC_LOGIN_FAILED and nothing is stored.

        Picnic normally demands a second factor, in which case the response is
        `PENDING_SECOND_FACTOR`, an SMS has already been sent, and linking is only
        complete once `/2fa/verify` succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicnicCredentialsRequest'
      responses:
        "200":
          description: Password accepted; see status for whether 2FA is still needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicnicLinkResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [PicnicExport]
      operationId: unlinkPicnicCredentials
      summary: Unlink the current user's Picnic account
      responses:
        "204":
          description: Credentials removed
        "401":
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [PicnicExport]
      operationId: getPicnicCredentialsStatus
      summary: Get the current user's Picnic credential link status
      responses:
        "200":
          description: Picnic credential link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicnicCredentialsStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users/me/picnic-credentials/2fa/send:
    post:
      tags: [PicnicExport]
      operationId: sendPicnicSecondFactor
      summary: Re-send the Picnic second-factor SMS code
      description: |
        Only valid while the link is PENDING_SECOND_FACTOR; otherwise responds
        422 with code PICNIC_SECOND_FACTOR_REQUIRED (nothing to resend), or
        PICNIC_CREDENTIALS_MISSING if no link exists at all.
      responses:
        "204":
          description: Code sent
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /users/me/picnic-credentials/2fa/verify:
    post:
      tags: [PicnicExport]
      operationId: verifyPicnicSecondFactor
      summary: Complete Picnic linking with the SMS code
      description: |
        On success the stored session is replaced with the verified one and the
        link becomes usable. A wrong or expired code responds 422 with code
        PICNIC_LOGIN_FAILED and leaves the pending link intact, so the user can
        retry without re-entering their password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicnicSecondFactorRequest'
      responses:
        "204":
          description: Second factor verified; the account is now linked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /lists/{listId}/picnic/suggestions/{itemId}:
    post:
      tags: [PicnicExport]
      operationId: getPicnicItemSuggestions
      summary: Get Picnic article suggestions for one item
      description: |
        One item per call, deliberately. Each Picnic search costs ~2-3 s of
        server-side render on their side, so searching a whole list up front
        made the wait grow linearly with list size and burned searches on items
        the user was going to skip. The client walks items one at a time and
        prefetches the next while the user decides.

        The item must be active (checked=false, deleted=false) and on the list;
        anything else responds 404. Requires a linked Picnic credential; if none
        is linked, responds 422 with code PICNIC_CREDENTIALS_MISSING. If the
        Picnic API itself is unreachable, responds 502 with code
        PICNIC_UNAVAILABLE. 403 also covers a group-less caller (code NO_GROUP),
        same convention as other list endpoints.
      parameters:
        - $ref: '#/components/parameters/ListId'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: searchTerm
          in: query
          required: false
          description: |
            Overrides what is sent to Picnic's search. Omit it and the item's own
            name is used, which is the right default but often a poor query —
            item names are freitext, and "test" matches a pregnancy test. The
            client seeds an editable field with the item name and sends this once
            the user changes it. Blank is treated as absent.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Picnic article suggestions for the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSuggestions'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "502":
          $ref: '#/components/responses/BadGateway'

  /picnic/search-terms:
    get:
      tags: [PicnicExport]
      operationId: getPicnicSearchTerms
      summary: Autocomplete a Picnic search term
      description: |
        Picnic's own autocomplete, proxied. Cheap enough to call while the user
        types — a response is a few hundred bytes and returns in well under the
        ~2-3 s a full search costs, because it hits a different endpoint that
        renders nothing.

        Not list-scoped: it needs the caller's Picnic session and nothing else.
        Requires a linked Picnic credential; if none is linked, responds 422
        with code PICNIC_CREDENTIALS_MISSING. If the Picnic API itself is
        unreachable, responds 502 with code PICNIC_UNAVAILABLE.
      parameters:
        - name: term
          in: query
          required: true
          description: The partial term the user has typed so far.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Suggested search terms, most relevant first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicnicSearchTerms'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "502":
          $ref: '#/components/responses/BadGateway'

  /lists/{listId}/picnic/export:
    post:
      tags: [PicnicExport]
      operationId: exportToPicnic
      summary: Add confirmed article selections to the user's Picnic cart
      description: |
        Requires a linked Picnic credential; if none is linked, responds 422
        with code PICNIC_CREDENTIALS_MISSING. If the Picnic API itself is
        unreachable, responds 502 with code PICNIC_UNAVAILABLE. 403 also
        covers a group-less caller (code NO_GROUP), same convention as other
        list endpoints.
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        "200":
          description: Export result summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "502":
          $ref: '#/components/responses/BadGateway'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NoGroup:
      description: >-
        Authenticated user does not belong to a group yet (code: NO_GROUP).
        Distinct from Forbidden so the frontend can route to onboarding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflicting state (e.g. already in a group)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Business rule violation (e.g. list is full, invite invalid/expired)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: Upstream provider unavailable (e.g. Picnic API down or blocked)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    UserProfile:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        group:
          allOf:
            - $ref: '#/components/schemas/GroupSummary'
          description: Absent or null means the user has not yet joined a group.
          nullable: true

    ShoppingList:
      type: object
      required: [id, name, ownerId, groupId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ShoppingListWithItems:
      allOf:
        - $ref: '#/components/schemas/ShoppingList'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ShoppingItem'

    LwwFieldString:
      type: object
      required: [value, timestamp, modifiedBy]
      properties:
        value:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Server-assigned epoch milliseconds
        modifiedBy:
          type: string
          format: uuid

    LwwFieldBoolean:
      type: object
      required: [value, timestamp, modifiedBy]
      properties:
        value:
          type: boolean
        timestamp:
          type: integer
          format: int64
        modifiedBy:
          type: string
          format: uuid

    ShoppingItem:
      type: object
      required: [id, listId, name, quantity, checked, deleted, sortKey, section]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        name:
          allOf:
            - $ref: '#/components/schemas/LwwFieldString'
          description: Item name; value maxLength 100
        quantity:
          $ref: '#/components/schemas/LwwFieldString'
        checked:
          $ref: '#/components/schemas/LwwFieldBoolean'
        deleted:
          $ref: '#/components/schemas/LwwFieldBoolean'
        sortKey:
          allOf:
            - $ref: '#/components/schemas/LwwFieldString'
          description: Fractional index for display ordering. Update via PATCH with field=SORT_KEY.
        section:
          allOf:
            - $ref: '#/components/schemas/LwwFieldString'
          description: >-
            Supermarket section code (server-classified at creation). Update via
            PATCH with field=SECTION; value must be a known Section enum code.

    ItemChangeRequest:
      type: object
      required: [field, value, modifiedBy]
      description: |
        Single-field LWW mutation. Server assigns timestamp — do not include timestamp in request.
        For SORT_KEY changes (moves), value must be a valid fractional index string.
        For NAME changes, value maxLength is 100.
      properties:
        field:
          $ref: '#/components/schemas/ItemField'
        value:
          type: string
          maxLength: 500
          description: Serialised value. Boolean fields use "true"/"false". Name field max 100 chars.
        modifiedBy:
          type: string
          format: uuid

    ItemChangeEvent:
      type: object
      required: [itemId, listId, field, value, timestamp, modifiedBy]
      description: SSE payload broadcast to all subscribers after a successful mutation.
      properties:
        itemId:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        field:
          $ref: '#/components/schemas/ItemField'
        value:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Server-assigned timestamp. Read-only for clients.
        modifiedBy:
          type: string
          format: uuid

    ItemField:
      type: string
      enum: [NAME, QUANTITY, CHECKED, DELETED, SORT_KEY, SECTION]

    AddItemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        quantity:
          type: string
          maxLength: 100
          default: "1"

    CreateListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    GroupSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    GroupResponse:
      type: object
      required: [id, name, createdAt, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'

    InviteType:
      type: string
      enum: [JOIN_GROUP, NEW_GROUP]

    CreateInviteRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/InviteType'

    InviteCodeResponse:
      type: object
      required: [code, type, expiresAt]
      properties:
        code:
          type: string
        type:
          $ref: '#/components/schemas/InviteType'
        expiresAt:
          type: string
          format: date-time

    RedeemInviteRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        groupName:
          type: string
          maxLength: 100
          description: >-
            Required only when redeeming a NEW_GROUP code; omitting it on a
            NEW_GROUP code returns 400 GROUP_NAME_REQUIRED.

    AuthCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Application JWT (Bearer token for subsequent requests)

    SseTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Short-lived SSE token (15-min TTL, scoped to listId)

    PicnicCredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          description: Never echoed back in any response.

    PicnicSecondFactorRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          writeOnly: true
          description: The one-time code Picnic sent by SMS.

    PicnicLinkState:
      type: string
      enum: [PENDING_SECOND_FACTOR, LINKED]
      description: |
        PENDING_SECOND_FACTOR means a session exists but can do nothing except
        complete 2FA — it is not a usable link.

    PicnicLinkResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/PicnicLinkState'

    PicnicCredentialsStatus:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
          description: True only for a fully verified link.
        email:
          type: string
          format: email
          nullable: true
          description: Present whenever anything is stored, including a pending link.
        status:
          allOf:
            - $ref: '#/components/schemas/PicnicLinkState'
          nullable: true
          description: Absent when nothing is stored at all.

    ArticleSuggestion:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Picnic's product id
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
        priceCents:
          type: integer
          nullable: true
        unit:
          type: string
          nullable: true
          description: e.g. "500g", "Stück"

    PicnicSearchTerms:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          maxItems: 10
          description: |
            Picnic's own autocomplete strings, e.g. for "Milch": h-milch,
            milchreis, milch laktosefrei, milchschnitte, bio milch.
          items:
            type: string

    ItemSuggestions:
      type: object
      required: [itemId, itemName, searchTerm, suggestions]
      properties:
        itemId:
          type: string
          format: uuid
        itemName:
          type: string
        searchTerm:
          type: string
          description: |
            The term actually sent to Picnic — the item name unless the request
            overrode it. Echoed back so a client that has moved on to a newer
            term can recognise and discard a stale response.
        suggestions:
          type: array
          maxItems: 20
          description: |
            Up to 20. Picnic returns ~120 products per search and the response is
            parsed in full regardless, so a deeper list costs nothing extra — and
            five was routinely too few to contain the right product.
          items:
            $ref: '#/components/schemas/ArticleSuggestion'

    ExportSelection:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string
          format: uuid
        articleId:
          type: string
          nullable: true
          description: >-
            Absent or null means the user skipped this item — no cart line
            is added.

    ExportRequest:
      type: object
      required: [selections]
      properties:
        selections:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExportSelection'

    ExportFailure:
      type: object
      required: [itemId, reason]
      properties:
        itemId:
          type: string
          format: uuid
        reason:
          type: string

    ExportResult:
      type: object
      required: [added, skipped, failures]
      properties:
        added:
          type: integer
        skipped:
          type: integer
        failures:
          type: array
          items:
            $ref: '#/components/schemas/ExportFailure'

    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: LIST_NOT_FOUND
        message:
          type: string
        timestamp:
          type: string
          format: date-time
